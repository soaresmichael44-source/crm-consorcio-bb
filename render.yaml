# Render: um serviço web com o CRM e o Portal do Gerente (wsgi.py).
# Segredos (banco, chaves, senha) ficam só no painel do Render — nunca neste arquivo.
services:
  - type: web
    name: crm-bb
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/Sao_Paulo
      - key: FORCAR_LOGIN
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRM_BB_SENHA
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CRM_BB_API_TOKEN
        sync: false
      - key: URL_PUBLICA_GERENTE
        sync: false
